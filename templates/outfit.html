{% extends "base.html" %}
{% block content %}
<section class="outfit-page">
    <h2>Your Generated Outfit</h2>

    <div class="outfit-grid">
        {% for item in outfit %}
        <article class="outfit-card">
            <img src="{{ item.image_path }}" alt="{{ item.name }}" class="outfit-image">
            <p>{{ item.name }} ({{ item.category }})</p>
        </article>
        {% endfor %}
    </div>

    <div class="outfit-explanation">
        <h3>Why this outfit?</h3>
        <p>{{ explanation }}</p>
    </div>
</section>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<section class="outfit-page">
    <h2>Your Generated Outfit</h2>

    <div class="outfit-grid">
        {% for item in outfit %}
        <article class="outfit-card">
            <img src="{{ item.image_path }}" alt="{{ item.name }}" class="outfit-image">
            <p>{{ item.name }} ({{ item.category }})</p>
        </article>
        {% endfor %}
    </div>

    <div class="outfit-explanation">
        <h3>Why this outfit?</h3>
        <pre id="explanation"></pre>
        <button id="generate-btn" class="button button-pink" >Generate Explanation</button>
    </div>
</section>

<script>
document.getElementById("generate-btn").addEventListener("click", () => {
    const explanationDiv = document.getElementById("explanation");
    explanationDiv.textContent = "";

    fetch("/generate/explanation")
        .then(response => {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            function read() {
                reader.read().then(({ done, value }) => {
                    if (done) return;
                    explanationDiv.textContent += decoder.decode(value);
                    read();
                });
            }

            read();
        });
});
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>

    <title>Outfit Planner</title>
    <link href="/static/styles.css" rel="stylesheet">
    <!-- Tailwind CDN for quick styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    </footer>
</body>
</html>

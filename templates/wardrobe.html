{% extends "base.html" %}
{% block content %}
<section class="wardrobe-page">
    <h2>Your Wardrobe</h2>
    <table class="wardrobe-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Image</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for item in wardrobe %}
            <tr id="item-row-{{ item.id }}">
                <td>{{ item.name }}</td>
                <td>{{ item.category }}</td>
                <td>
                    <img src="{{ item.image_path }}" alt="{{ item.name }}" class="wardrobe-image">
                </td>
                <td class="actions-cell">
                    <form action="/wardrobe/delete/{{ item.id }}" method="post">
                        <button type="submit" class="button button-red">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</section>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<h2 class="text-lg font-semibold mb-4">Upload your clothes and accessories</h2>
<form action="/upload" method="post" enctype="multipart/form-data" class="space-y-4">
    <div>
        <label class="block mb-1">Item Name:</label>
        <input type="text" name="name" class="border p-2 w-full">
    </div>
    <div>
        <label class="block mb-1">Category:</label>
        <select name="category" class="border p-2 w-full">
            <option value="top">Top</option>
            <option value="bottom">Bottom</option>
            <option value="shoes">Shoes</option>
            <option value="outerwear">Outerwear</option>
            <option value="accessory">Accessory</option>
        </select>
    </div>
    <div>
        <label class="block mb-1">Image:</label>
        <input type="file" name="image" class="border p-2 w-full">
    </div>
    <button type="submit" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">Upload</button>
</form>
{% endblock %}
